[project]
name = "rag-say-no"
version = "0.1.0"
description = "Grounded RAG that cites every claim and abstains when the documents do not support an answer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "bm25s>=0.3.16",
    "numpy>=2.4.6",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0", "torch>=2.3"]
llm = [
    "anthropic>=2.8.0",
    "openai>=3.50.0",
]

[project.scripts]
ragkit = "ragkit.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragkit"]

# CPU-only torch: avoids multi-GB CUDA wheels on machines without a GPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: the formatter owns line length. B008: typer declares options as call defaults.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
