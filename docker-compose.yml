services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      CONFIG: ${CONFIG:-configs/toy.yaml}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data:ro
      - ./configs:/app/configs:ro
      # Named volume, not a bind mount: it inherits the image's ownership, so the non-root user
      # can write the index.
      - artifacts:/app/artifacts

volumes:
  artifacts:
